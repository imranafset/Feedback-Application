stages:
  - build
  - test

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# 1. Build & Push to Docker Hub
build_images:
  stage: build
  tags:
    - dev-laptop
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
    - docker build -t "$DOCKER_USER/feedback-backend:latest" ./backend
    - docker build -t "$DOCKER_USER/feedback-worker:latest" ./worker
    - docker push "$DOCKER_USER/feedback-backend:latest"
    - docker push "$DOCKER_USER/feedback-worker:latest"

# 2. Security & Quality Scan
sonarqube_scan:
  stage: test
  tags:
    - dev-laptop
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner 
      -Dsonar.projectKey=Feedback-App 
      -Dsonar.sources=. 
      -Dsonar.host.url=$SONAR_URL 
      -Dsonar.login=$SONAR_TOKEN
  allow_failure: true