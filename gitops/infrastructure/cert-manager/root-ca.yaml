apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: feedback-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: feedback-internal-ca
  secretName: feedback-ca-secret
  issuerRef:
    name: self-signed-issuer
    kind: ClusterIssuer


---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: feedback-ca-issuer
spec:
  ca:
    secretName: feedback-ca-secret