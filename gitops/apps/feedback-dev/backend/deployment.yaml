apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: feedback-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: faizalaccount/feedback-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          
          # --- Health Checks (Probes) ---
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          # ------------------------------

          env:
            # Database Configuration (Postgres)
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"      
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret  # This name matches your SealedSecret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            # MongoDB Configuration (If your app uses both or is switching)
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-pass    # This name matches your SealedSecret
                  key: password

            # RabbitMQ Configuration (Secure version)
            # Instead of amqp://guest:guest@rabbitmq:5672/
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: url