apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-ingress
  namespace: feedback-dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "feedback-ca-issuer"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - feedback-dev.example.com
    secretName: feedback-dev-tls
  rules:
  - host: feedback-dev.example.com
    http:
      paths:
      # 1. Backend Path: Rewrites /api/feedback -> /feedback
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 80

      # 2. Frontend Path: Rewrites / -> / (using dummy group)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80