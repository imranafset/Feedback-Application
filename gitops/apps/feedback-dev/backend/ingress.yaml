apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-ingress
  namespace: feedback-dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # MATCH THIS to your ClusterIssuer name
    cert-manager.io/cluster-issuer: "self-signed-issuer" 
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - feedback-dev.example.com
    # MATCH THIS to your existing secret
    secretName: feedback-tls-cert 
  rules:
  - host: feedback-dev.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80