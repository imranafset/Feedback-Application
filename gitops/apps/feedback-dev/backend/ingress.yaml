apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-ingress
  namespace: feedback-dev
  annotations:
    # This is the "force" trigger for Nginx
    kubernetes.io/ingress.class: "nginx" 
    cert-manager.io/cluster-issuer: "feedback-ca-issuer"
spec:
  ingressClassName: nginx
  rules:
  - host: feedback-dev.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080