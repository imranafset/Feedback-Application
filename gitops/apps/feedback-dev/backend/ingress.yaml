apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-ingress
  namespace: feedback-dev
  annotations:
    # This annotation is the "legacy" trigger that often works 
    # when the ingressClassName alone fails in MicroK8s
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "feedback-ca-issuer"
spec:
  ingressClassName: nginx 
  tls:
    - hosts:
        - feedback-dev.example.com
      secretName: feedback-tls-cert
  rules:
    - host: feedback-dev.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix # Changed from null/ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix # Changed from null/ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80