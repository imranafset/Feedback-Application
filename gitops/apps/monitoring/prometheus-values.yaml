server:
  persistentVolume:
    enabled: true
    size: 8Gi
  ingress:
    enabled: false # Keep internal; access via Grafana

alertmanager:
  enabled: false # We use Grafana Alerting instead

# This part is critical: it tells Prometheus to look for your app's metrics
extraScrapeConfigs: |
  - job_name: 'feedback-app'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app