server:
  persistentVolume:
    enabled: true
    size: 8Gi
  ingress:
    enabled: false # Keep internal; access via Grafana

# Enable Alertmanager to route alerts to Grafana Cloud OnCall
alertmanager:
  enabled: true
  persistentVolume:
    enabled: false

alertmanagerFiles:
  alertmanager.yml:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'grafana-cloud-oncall'
    receivers:
    - name: 'grafana-cloud-oncall'
      webhook_configs:
      - url: 'https://oncall-prod-us-central-0.grafana.net/oncall/integrations/v1/formatted_webhook/wX4yLsgiMmOvJCacy1OjXYw0G/'
        send_resolved: true

# App Scrape Configuration
extraScrapeConfigs: |
  - job_name: 'feedback-app'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app